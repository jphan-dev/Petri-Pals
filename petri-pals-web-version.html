    case 'cbToggle':S.cb=!S.cb;applyPalette();render();break;
    case 'textScale':S.textScale=+d.v;applyA11y();save();render();break;
    case 'bigTap':S.bigTap=!S.bigTap;applyA11y();save();render();break;
    case 'plainFont':S.plainFont=!S.plainFont;applyA11y();save();render();break;
    case 'hapticsToggle':S.haptics=S.haptics===false;save();haptic('light');render();break;
    case 'notifyToggle':{S.notify=!S.notify;save();if(S.notify){if(!native('notifyAsk')){toast('Reminders only work in the iPhone app.');}scheduleAlerts();}else native('notify',{jobs:[]});render();break;}
    case 'tutRestart':showTours();break;
    case 'tutNext':{const T=curTut();S.tut=Math.min(T.length-1,S.tut+1);if(T[S.tut][0])tab=T[S.tut][0];render();break;}
    case 'tutBack':{const T=curTut();S.tut=Math.max(0,S.tut-1);if(T[S.tut][0])tab=T[S.tut][0];render();break;}
    case 'tourCore':S.tour='core';S.tut=0;S.tutReplay=false;tab='field';view=null;closeModal();render();window.scrollTo(0,0);break;
    case 'tourTabs':S.tour='tabs';S.tut=0;S.tutReplay=false;tab='field';view=null;closeModal();render();window.scrollTo(0,0);break;
    case 'tourAdv':S.tour='adv';S.tut=0;S.tutReplay=false;tab='field';view=null;closeModal();render();window.scrollTo(0,0);break;
    case 'tourNone':S.tut=99;closeModal();render();break;
    case 'tours':showTours();break;
    case 'welcomeAgain':showWelcome();break;
    case 'tutShowDex':{const id=S.lastIded&&S.owned[S.lastIded]?S.lastIded:MB_IDS.find(i=>S.owned[i]&&i!=='ecoli')||'ecoli';tab='dex';render();showDex(id);break;}
    case 'tutSkip':S.tut=99;S.tutReplay=false;render();break;
    case 'resGuide':showResGuide();break;
    case 'restoreBak':restoreBackup(+d.v);break;
    case 'bakNow':makeBackup(true);toast('Snapshot saved.');render();break;
    case 'exportSave':{const b=document.getElementById('savebox');try{b.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));b.select();try{navigator.clipboard&&navigator.clipboard.writeText(b.value);}catch(e){}toast('Save code ready. Copy it somewhere safe.');}catch(e){toast('Could not export.');}break;}
    case 'importSave':{const b=document.getElementById('savebox');try{const o=JSON.parse(decodeURIComponent(escape(atob(b.value.trim()))));if(!o||!o.owned)throw 0;makeBackup(true);S=migrate(o);save();applyPalette();toast('Lab restored!');render();}catch(e){toast('That save code did not work.');}break;}
    case 'gelPick':gelPick(d.v);break;
    case 'bioAlign':bioAlign();break;case 'alTap':alTap(d.v);break;case 'alSubmit':alSubmit();break;case 'alReset':if(alSt){alSt.row=alSt.B.slice();drawAlign();}break;
    case 'bioPhylo':bioPhylo();break;
    case 'bioMSA':bioMSA();break;case 'msaTap':msaTap(d.v);break;case 'msaSubmit':msaSubmit();break;case 'msaReset':if(msaS){msaS.rows=msaS.reads.map(r=>r.slice());drawMSA();}break;
    case 'bioGuide':showBioGuide();break;case 'phyTap':phyTap(d.v);break;
    case 'bioFold':bioFold();break;case 'hpTap':hpTap(d.v);break;case 'hpSubmit':hpSubmit();break;case 'hpUndo':if(hpS&&hpS.path.length>1){hpS.path.pop();drawFold();}break;case 'hpReset':if(hpS){hpS.path=[[0,0]];drawFold();}break;
    case 'bioORF':bioORF();break;case 'orfTap':orfTap(d.v);break;case 'orfCodon':orfTap(+d.v+2);break;
    case 'evoStart':evoStart();break;
    case 'evoTransfer':evoTransfer();break;
    case 'rsStress':rs.stress=d.v;render();break;
    case 'rsSrc':rs.phSrc=d.v;render();break;
    case 'rsMud':rs.mud=d.v;render();break;
    case 'ccRun':ccRun();break;
    case 'resSec':rs.sec=d.v;keepScroll=false;render();break;
    case 'labSec':labSec=d.v;keepScroll=false;render();break;
    case 'nbSec':nbSec=d.v;keepScroll=false;render();break;
    case 'kbRun':kbRun();break;
    case 'skills':showSkills();break;
    case 'skill':{closeModal();({pip:pipStart,hemo:hemStart,glove:glvStart,contam:conStart,pcr:pcrStart,primer:primerStart})[d.v]();break;}
    case 'pcrMix':pcrMix(d.v);break;case 'pcrSet':pcrSet(d.v);break;case 'pcrNext':pcrNext();break;case 'pcrRun':pcrRun();break;case 'pcrDone':pcrDone();break;
    case 'prPick':prPick(d.v);break;case 'prRev':prRev(d.v);break;
    case 'pipVol':if(pipS){pipS.vol=+d.v;drawPip();}break;case 'pipDil':if(pipS){pipS.dil=+d.v;drawPip();}break;case 'pipStep':pipStep();break;case 'pipDone':pipDone();break;case 'pipReset':if(pipS){pipS.steps=[];drawPip();}break;
    case 'hemCount':hemCount(d.v);break;
    case 'hemTap':hemTap(d.v);break;case 'hemNext':hemNext();break;case 'hemPick':hemPick(d.v);break;
    case 'glvTap':glvTap(d.v);break;
    case 'conTap':conTap(d.v);break;case 'conDone':conDone();break;
    case 'micRun':micRun();break;case 'micTap':micTap(d.v);break;
    case 'gcRun':gcRun();break;case 'gcPick':gcPick(d.v);break;
    case 'mfcRun':mfcRun();break;case 'mfcTry':mfcTry(d.v);break;case 'mfcLock':mfcLock();break;
    case 'swimRun':swimRun();break;case 'swimPick':swimPick(d.v);break;
    case 'amesRun':amesRun();break;case 'amesCall':amesCall(d.v);break;case 'amesDone':amesDone();break;
    case 'openArt':openArt();break;
    case 'artView':{const u=(S.art||[])[+d.v];if(u)openModal(`<h2>🎨 Your agar art</h2><div style="text-align:center;margin-top:10px"><img src="${u}" alt="Your agar art" style="width:100%;max-width:420px;border-radius:50%;box-shadow:0 0 0 8px var(--glass);image-rendering:auto"></div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn sm ghost" data-act="artDel" data-v="${d.v}">Delete</button><button class="btn sm" data-act="close">Close</button></div>`);break;}
    case 'artDel':S.art.splice(+d.v,1);closeModal();render();break;
    case 'artCol':if(artSt)artSt.col=d.v;artHook(0);break;
    case 'artSz':if(artSt)artSt.sz=+d.v;break;
    case 'artUndo':if(artSt&&!artSt.grown){const last=artSt.stroke;artSt.dots=artSt.dots.filter(p=>p[4]!==last);artSt.stroke--;artDraw(0);}break;
    case 'artClear':if(artSt&&!artSt.grown){artSt.dots=[];artDraw(0);}break;
    case 'artGrow':artGrow();break;
    case 'bfRun':bfRun();break;
    case 'phRun':phRun();break;
    case 'winoStart':if(!S.wino&&S.money>=60){S.money-=60;S.wino={start:Date.now(),mud:rs.mud};render();}break;
    case 'winoHarvest':winoHarvest();break;
    case 'paperWrite':paperWrite();break;
    case 'evChoice':evChoice(d.v);break;
    case 'phPick':phPick(d.v);break;
    case 'phCalc':phCalc(d.v);break;
    case 'restyle2':{draft={...draft,...S.player};setupSec='face';S.player=null;renderSetup();break;}
    case 'mgStop':mgStop();break;
    case 'focusLock':focusLock();break;
    case 'gramAdd':gramAdd(d.v);break;
    case 'oxRead':oxRead();break;
    case 'afbDrop':afbDrop();break;
    case 'afbRinse':afbRinse();break;
    case 'swirl':swirl();break;
    case 'huntTap':huntTap(d.v);break;
    case 'starchRead':starchRead();break;
    case 'mgPick':mgPick(d.v);break;
    case 'swipeDone':swipeDone();break;
    case 'seqCall':seqCall(d.v);break;
    case 'glGene':{const i=gl.genes.indexOf(d.v);if(i>=0)gl.genes.splice(i,1);else gl.genes.push(d.v);gl.result='';renderGene();save();break;}
    case 'glStep':glStep=d.v;keepScroll=false;renderGene();break;
    case 'glMethod':if(hasMeth(d.v)){gl.method=d.v;gl.result='';}renderGene();break;
    case 'buyMeth':{const [c,lv]=METH_SHOP[d.v]||[];if(!c||hasMeth(d.v)||S.level<lv||S.money<c)return;S.money-=c;S.methods=[...(S.methods||['nat','heat']),d.v];gl.method=d.v;sfx('good');toast(`${METHODS[d.v].name} is set up.`);render();break;}
    case 'catToggle':{gl.open=gl.open||{};const cur=gl.open[d.v]!==undefined?gl.open[d.v]:GENES.some(G=>G.tags[0]===d.v&&(gl.genes.includes(G.id)||grantWants(G.id)));gl.open[d.v]=!cur;renderGene();break;}
    case 'grantF':grantF=d.v;render();break;
    case 'workGrant':S.activeGrant=d.g;tab='gene';gl.result='';grantFill(true);toast('Grant pinned to the Gene lab.');render();window.scrollTo(0,0);break;
    case 'grantFill':grantFill(false);render();break;
    case 'grantClear':S.activeGrant=null;render();break;
    case 'transform':{const info=strainInfo(gl.host),M=METHODS[gl.method],cost=(gl.genes||[]).reduce((a,g)=>a+GENE[g].cost,0)+M.cost;if(!gl.genes.length||S.money<cost)return;cloneGame(gl.genes,q=>{gl.cloneQ=q;doTransform();});break;}
    case 'clPick':clPick(d.v);break;
    case 'clGo':clGo();break;
    case 'deliver':deliver(d.g,d.s);break;
    case 'ext':{const u=d.v;try{if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.openurl){window.webkit.messageHandlers.openurl.postMessage(u);}else{const w=window.open(u,'_blank');if(!w)location.href=u;}}catch(e){location.href=u;}break;}
    case 'geneGuide':showGeneGuide();break;
    case 'geneInfo':showGeneInfo(d.v);break;
    case 'deliverPhage':{const g=GRANTS.find(x=>x.id===d.g);if(!g||gCooling(g.id)||S.phages.length<g.need.phages)return;const pay=payFor(g);S.gems+=gemFor(g);S.grants[g.id]=(S.grants[g.id]||0)+1;S.gcool=S.gcool||{};S.gcool[g.id]=Date.now()+(staffLv('manager')>=3?120000:300000);S.money+=pay;addRep(8);S.stats.grants++;S.stats.earned+=pay;addXP(g.xp);addData(3);toast(`${g.t} delivered! +$${pay}`);render();break;}
    case 'dex':showDex(d.id);break;
    case 'dexF':if(dexF.has(d.v))dexF.delete(d.v);else dexF.add(d.v);render();break;
    case 'dexClear':dexF.clear();render();break;
    case 'dexOwned':dexOwned=!dexOwned;render();break;
    case 'dexSort':dexSort=d.v;render();break;
    case 'cellGuide':showCellGuide();break;
    case 'phageInfo':showPhage(d.v);break;
    case 'dexView':dexView=d.v;render();break;
    case 'dexPhage':dexPhage=!dexPhage;render();break;
    case 'claimAll':{let g=0;MISSIONS.forEach(x=>{const[a,b]=x.p();if(a>=b&&!S.claimed[x.id]){S.claimed[x.id]=1;S.gems+=x.g;g+=x.g;}});if(g){sfx('claim');toast(`+${g} 🧪`);}render();break;}
    case 'claim':{const x=MISSIONS.find(y=>y.id===d.id),[a2,b]=x.p();if(a2>=b&&!S.claimed[x.id]){S.claimed[x.id]=1;S.gems+=x.g;toast(`+${x.g} 🧪`);render();}break;}
    case 'reset':openModal(`<h2>Start over?</h2><p>This erases your collection, strains, and progress on this device.</p><div class="row" style="margin-top:12px"><button class="btn pink" data-act="resetYes">Erase and restart</button><button class="btn ghost" data-act="close">Keep playing</button></div>`);break;
    case 'resetYes':makeBackup(true);S=fresh();save();closeModal();tab='field';view=null;render();break;
  }
}
const HAP_ACT={pick:'light',harvest:'success',harvestAll:'success',claim:'success',deliver:'success',deliverPhage:'success',paperWrite:'success',buyUp:'medium',hire:'medium',premium:'medium',transform:'medium',quizPick:'light',conTap:'light',huntTap:'light',hemCount:'light',glvTap:'light',gramAdd:'light',swirl:'light',afbDrop:'light',seqCall:'light',gelPick:'light',artCol:'light',clPick:'light',mgPick:'light',prPick:'light',pcrMix:'light'};
const SFX_ACT={claim:'claim',harvest:'coin',harvestAll:'coin',pick:'pop',deliver:'claim',deliverPhage:'claim',paperWrite:'fanfare',buyUp:'good',hire:'good',premium:'reveal'};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;if(t.tagName==='A')e.preventDefault();const a=t.dataset.act;if(SFX_ACT[a])sfx(SFX_ACT[a]);if(HAP_ACT[a])haptic(HAP_ACT[a]);act(a,t.dataset);});
document.addEventListener('pointerdown',e=>{const sw=e.target.closest&&e.target.closest('[data-swat]');if(sw){e.preventDefault();swat(sw.dataset.swat);return;}
  if(e.target.closest&&e.target.closest('#holdBtn')&&holdSt){holdSt.holding=true;e.preventDefault();}});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(holdSt)holdSt.holding=false;}));
document.addEventListener('keyup',e=>{if(e.key===' '&&holdSt)holdSt.holding=false;});
document.addEventListener('keydown',e=>{if(e.key===' '&&holdSt&&document.activeElement&&document.activeElement.id==='holdBtn'){e.preventDefault();holdSt.holding=true;return;}
  if(e.key==='Escape'&&$('#ov').classList.contains('show')){if(gramTimer)clearInterval(gramTimer);cleanupMG();closeModal();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-act]')){e.preventDefault();act(e.target.dataset.act,e.target.dataset);}});
document.addEventListener('input',e=>{if(e.target.dataset.change==='name')draft.name=e.target.value;
  if(e.target.dataset.change==='geneq'){gl.q=e.target.value;const p=e.target.selectionStart;renderGene();const el=document.getElementById('geneq');if(el){el.focus();try{el.setSelectionRange(p,p);}catch(err){}}}
  if(e.target.dataset.change==='dexq'){dexQ=e.target.value;const p=e.target.selectionStart;render();const el=document.getElementById('dexq');if(el){el.focus();try{el.setSelectionRange(p,p);}catch(err){}}}if(e.target.id==='fz')focusInput(e.target.value);});
document.addEventListener('change',e=>{const k=e.target.dataset.change;if(k==='ckey'){cs.key=e.target.value;const p=(S.pref||{})[cs.key];if(p&&hasMed(p.medium)){cs.medium=p.medium;cs.T=p.T;}renderStart();}if(k==='glhost'){gl.host=e.target.value;gl.genes=[];gl.result='';renderGene();}if(k==='rsEvo')rs.evoKey=e.target.value;if(k==='rsA')rs.ccA=e.target.value;if(k==='rsB')rs.ccB=e.target.value;if(k==='rsPh')rs.phHost=e.target.value;if(k==='rsKB')rs.kbKey=e.target.value;if(k==='rsMic')rs.micKey=e.target.value;if(k==='rsMicAb')rs.micAb=e.target.value;if(k==='rsGc')rs.gcKey=e.target.value;if(k==='rsMfc')rs.mfcKey=e.target.value;if(k==='rsSwA')rs.swA=e.target.value;if(k==='rsSwB')rs.swB=e.target.value;if(k==='bioOrg'){S.bioOrg=e.target.value;render();}if(k==='rsBF')rs.bfKey=e.target.value;});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&!gramCb&&!mgActive())closeModal();});
const topBtn=document.getElementById('totop');
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
window.addEventListener('scroll',()=>{topBtn.style.display=window.scrollY>600?'block':'none';},{passive:true});
applyColours();load();applyPalette();applyA11y();render();awayReport();
document.addEventListener('pointerdown',function resumeMusic(){if(S&&S.player&&S.music&&!AC)startMusic();document.removeEventListener('pointerdown',resumeMusic,true);},true);
setInterval(()=>{if(!S.player||document.hidden)return;
  let rr=false;document.querySelectorAll('[data-until]').forEach(el=>{const left=(+el.dataset.until-Date.now())/1000;if(left<=0){if(el.dataset.rerender)rr=true;}else el.textContent=fmtTime(left);});
  if(rr&&!$('#ov').classList.contains('show'))render();
  techWork();maybeEvent();if(tab==='incubator'&&!$('#ov').classList.contains('show'))tickInc();
  const btn=document.querySelector('nav.tabs [data-t="incubator"]');if(btn){const ready=S.cultures.some((c,i)=>c&&i<slots()&&phaseOf(c).k==='stat'),hasDot=btn.querySelector('.dot');
   if(ready&&!hasDot)btn.insertAdjacentHTML('beforeend','<span class="dot"></span>');if(!ready&&hasDot)hasDot.remove();}},800);
setInterval(()=>{if(S.player&&!document.hidden){S.lastSeen=Date.now();save();gcPush();scheduleAlerts();}},6000);
